[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kuma-agent"
version = "0.83.0"
description = "Muse を頭脳にした自律開発エージェント（GitHub Issue 起点）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
kuma-agent = "kuma_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kuma_agent"]
