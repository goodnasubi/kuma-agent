# kuma-agent をコンテナで動かすための設定。
#
# 使い方:
#   1. .env.example を .env にコピーして、使う頭脳の API キーを書く
#   2. docker compose up -d --build
#   3. ブラウザで http://localhost:8765 を開く
#
# 外から試す場合（お試し公開）:
#   1. .env に KUMA_WEB_PASSWORD を必ず設定する（ログインなしでは
#      公開先のだれでも会話できてしまう）
#   2. docker compose --profile tunnel up -d --build
#   3. docker compose logs cloudflared に出る
#      https://〜.trycloudflare.com の URL を開く
#   URL は起動のたびに変わります。恒常的な公開には向きません。
#
# ホスト側のポートは、この PC からだけ届くよう 127.0.0.1 に
# 絞ってある（同じネットワークの他の機器からは直接開けない）。
# 外からはトンネル経由で開くこと。

services:
  kuma-agent:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    env_file:
      - .env
    volumes:
      - kuma-data:/data
    restart: unless-stopped

  # Cloudflare の Quick Tunnel（アカウント不要のお試し公開）。
  # プロファイルを指定したときだけ起動する。
  # コンテナ同士の通信で kuma-agent へ繋ぐので、ホスト側のポートを
  # 127.0.0.1 に絞ってもトンネルの動きは変わらない。
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://kuma-agent:8765
    depends_on:
      - kuma-agent
    profiles:
      - tunnel
    restart: unless-stopped

volumes:
  kuma-data:
